[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsent-lakehouse"
version = "1.0.0"
description = "FinSent Databricks/PySpark workflows: Delta bronze/silver/gold + MLflow evaluation"
requires-python = ">=3.10"
# pyspark / delta-spark / mlflow are provided by the Databricks runtime; install them locally.
dependencies = ["pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
local = ["pyspark==3.5.3", "delta-spark==3.2.1", "mlflow==2.17.2"]

[project.scripts]
finsent-bronze = "finsent_lakehouse.bronze:run"
finsent-silver = "finsent_lakehouse.silver:run"
finsent-gold = "finsent_lakehouse.features:run"
finsent-evaluate = "finsent_lakehouse.evaluate:run"

[tool.setuptools.packages.find]
where = ["src"]
