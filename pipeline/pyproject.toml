[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsent"
version = "1.0.0"
description = "Financial sentiment & pattern analysis pipeline for BIST market data and KAP disclosures"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "boto3>=1.34",
    "pymysql>=1.1",
    "pydantic>=2.6",
    "anthropic>=0.75",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "moto[s3]>=5"]

[project.scripts]
finsent = "finsent.cli:main"

[tool.setuptools.packages.find]
include = ["finsent*"]

[tool.setuptools.package-data]
finsent = ["resources/*.json", "resources/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
