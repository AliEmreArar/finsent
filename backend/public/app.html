<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinSent · Borsa İstanbul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#/piyasa"><span class="brand-mark"></span>FinSent</a>
  <nav>
    <a href="#/piyasa" data-route="piyasa"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg><span>Piyasa</span></a>
    <a href="#/hisse" data-route="hisse"><svg viewBox="0 0 24 24"><path d="M6 4v16M12 7v10M18 10v6"/><rect x="4" y="8" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="5" rx="1"/><rect x="16" y="11" width="4" height="3" rx="1"/></svg><span>Hisse</span></a>
    <a href="#/cift/PGSUS/THYAO" data-route="cift"><svg viewBox="0 0 24 24"><path d="M3 17c4-8 7-8 9-4s5 4 9-4"/><path d="M3 12c4-6 7-6 9-2s5 3 9-3" opacity=".5"/></svg><span>Çift</span></a>
    <a href="#/bildirimler" data-route="bildirimler"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg><span>KAP</span></a>
    <a href="#/sinyaller" data-route="sinyaller"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Sinyaller</span></a>
    <a href="#/analiz" data-route="analiz"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span>Analiz</span></a>
    <a href="#/sistem" data-route="sistem"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Sistem</span></a>
  </nav>
  <div class="sidebar-foot" id="llm-status"></div>
</aside>

<div class="shell">
  <header class="topbar">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" placeholder="Hisse ara… (ASELS, THYAO)" autocomplete="off" spellcheck="false">
      <div id="search-results" class="search-results"></div>
    </div>
    <div class="topbar-right"><span id="asof" class="muted"></span>
      <div class="bell-wrap"><button class="icon-btn" id="bell" title="Alarmlar"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 004 0"/></svg><span class="bell-n" id="bell-n"></span></button>
        <div class="bell-menu" id="bell-menu"></div></div>
      <button class="btn agent-toggle" id="agent-toggle" title="Grok asistanı (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>Asistan</button></div>
  </header>

  <main id="view" class="view"></main>
</div>

<aside class="agent" id="agent" aria-label="Grok asistan">
  <div class="agent-head">
    <div><div class="agent-title"><span class="brand-mark" style="width:14px;height:14px;border-radius:5px"></span>Grok asistan</div>
      <div class="agent-ctx" id="agent-ctx"></div></div>
    <div style="display:flex;gap:6px"><button class="icon-btn" id="agent-new" title="Yeni sohbet"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="agent-close" title="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <div class="agent-body" id="agent-body"></div>
  <form class="agent-input" id="agent-form">
    <button class="icon-btn" type="button" id="agent-snap" title="Grafiğin görüntüsünü ekle (Grok görsel olarak yorumlar)"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <textarea id="agent-text" rows="1" placeholder="Bir şey sor…"></textarea>
    <button class="btn primary" id="agent-send" type="submit" title="Gönder (Enter)"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
  </form>
</aside>
<div id="toast" class="toast"></div>
<script src="/assets/draw.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/agent.js"></script>
</body>
</html>
